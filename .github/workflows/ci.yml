name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust, architecture, and docs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check host-free audio backend
        run: |
          cargo clippy -p audio_backend --no-default-features --all-targets -- -D warnings
          cargo test -p audio_backend --no-default-features --all-targets

      - name: Run hardware-free workspace tests
        run: cargo test --workspace --all-targets

      - name: Check dependency direction
        run: python3 scripts/check_architecture.py

      - name: Check documentation
        run: python3 scripts/docs/check_docs.py

      - name: Exercise roadmap generator
        run: python3 scripts/docs/sync_roadmap.py --stdout > /dev/null

  frontend:
    name: Svelte frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Test frontend
        run: bun run test

      - name: Build static frontend assets
        run: |
          bun run build
          bun run build:custom-base

  macos-tests:
    name: macOS workspace tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run hardware-free workspace tests
        run: cargo test --workspace --all-targets
