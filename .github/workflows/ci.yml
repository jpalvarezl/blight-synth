name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust, architecture, and docs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check host-free audio backend
        run: |
          cargo clippy -p audio_backend --no-default-features --all-targets -- -D warnings
          cargo test -p audio_backend --no-default-features --all-targets

      - name: Verify release callback debug logs compile out
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --release -p dsp diagnostics::tests::argument_evaluation_matches_diagnostic_build_mode

      - name: Run hardware-free workspace tests
        run: cargo test --workspace --all-targets

      - name: Check dependency direction
        run: python3 scripts/check_architecture.py

      - name: Check callback logging policy
        run: python3 scripts/check_rt_logging.py

      - name: Check documentation
        run: python3 scripts/docs/check_docs.py

      - name: Exercise roadmap generator
        run: python3 scripts/docs/sync_roadmap.py --stdout > /dev/null

  macos-tests:
    name: macOS workspace tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run hardware-free workspace tests
        run: cargo test --workspace --all-targets
