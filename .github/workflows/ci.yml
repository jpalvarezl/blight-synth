name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust, architecture, and docs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run hardware-free workspace tests
        run: cargo test --workspace --all-targets

      - name: Check dependency direction
        run: python3 scripts/check_architecture.py

      - name: Check documentation
        run: python3 scripts/docs/check_docs.py

      - name: Exercise roadmap generator
        run: python3 scripts/docs/sync_roadmap.py --stdout > /dev/null

  macos-tests:
    name: macOS workspace tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run hardware-free workspace tests
        run: cargo test --workspace --all-targets
