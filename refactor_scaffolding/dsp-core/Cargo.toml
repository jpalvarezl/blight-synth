[package]
name = "dsp-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dsp-core"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
rosc = "0.10"          # OSC
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
