[workspace]
resolver = "2"
members = ["dsp", "engine", "audio_backend", "utils", "sequencer", "tracker_gui", "os_dls", "param_manifest", "node_registry", "portable_state"]
default-members = ["tracker_gui"]

[workspace.dependencies]
bincode = "2.0.1"
cpal = "0.15"
clap = { version = "4.5.41", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
crossbeam = "0.8"
ringbuf = "0.4.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
serde_with = "3.14"
hound = "3.5"
sha2 = "0.10"
rosc = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time"] }
eframe = "0.33"
egui_extras = "0.33"
rfd = "0.15"
arrayvec = "0.7"

dsp = { path = "dsp" }
engine = { path = "engine" }
sequencer = { path = "sequencer" }
utils = { path = "utils" }
audio_backend = { path = "audio_backend", default-features = false }
os_dls = { path = "os_dls" }
param_manifest = { path = "param_manifest" }
node_registry = { path = "node_registry" }
portable_state = { path = "portable_state" }
